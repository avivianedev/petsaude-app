name: CI

on:
  pull-request:
    branches: [main]

  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          none-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npx jest --ci
